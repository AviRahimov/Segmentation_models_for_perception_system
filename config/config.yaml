# Off-Road Robotics Perception — main configuration

models:
  # Model + profile must match: 2-class checkpoints -> profile 2class,
  # merged_6class checkpoints -> profile 6class,
  # a fine-tuned RF-DETR checkpoint -> profile rfdetr_2class / rfdetr_6class
  # (own profiles, NOT 2class/6class — see the rfdetr_2class block below for why).
  # Previous production pair: profile 6class +
  #   name: yolo11s, weights: weights/detection/yolo11s/merged_6class/noaug/best.pt
  instance:
    enabled: true
    # yolo11s/merged_6class/noaug (27k-image dataset) is still the more
    # battle-tested option — switch back to it (see commented lines below)
    # if rfdetr-m doesn't hold up as well as this 157-image smoke test on
    # your real footage.
    name: "rfdetr-m"                    # <-- switch here: rfdetr-m | rfdetr-2xl (higher mAP, ~4x heavier) | yolo11s
    # name: "yolo11s"
    profile: rfdetr_2class               # <-- switch here: 2class | 6class | rfdetr_2class | rfdetr_6class
    # weights: "weights/detection/rfdetr-m/merged_2class/coco/best.pt"
    # weights: "weights/detection/rfdetr-2xl/merged_6class/coco/best.pt"      # best of the 3 (mAP50=0.654)
    weights: "weights/detection/rfdetr-m/detection_dataset_hardneg/conservative_aug/best.pt"    # 2-class — pair with profile: rfdetr_2class
    # weights: "weights/detection/yolo11s/merged_6class/noaug/best.pt"
    # Ignored by RF-DETR — fixed per-variant input resolution (576px for
    # -m, 880px for -2xl); only affects YOLO models. Harmless to leave set.
    imgsz: 1280
    # An already-confirmed track may accept a sub-threshold detection to keep
    # following the object's real position, instead of freezing/fading via
    # hold. Never creates or (re)confirms a track on its own.
    # NOTE: not implemented for RF-DETR yet (RFDETRInstanceModel accepts
    # this kwarg but ignores it) — has no effect while name: rfdetr-*.
    low_conf_recovery:
      enabled: true
      recovery_conf_floor: 0.10   # below a class's own threshold, above this -> recovery-only

  # Other options: segformer-b0 (fastest), segformer-b1, segformer-b4
  semantic:
    name: "segformer-b2"
    weights: "weights/segmentation/orfd/frozen_backbone/segformer-b2/best.pth"
    # weights: "weights/segmentation/orfd/distilled_segformer-b2/best.pth"
    # weights: "weights/segmentation/orfd/mask2former-large/best.pth"
    num_classes: 3
    processor_size: 256

# ===========================================================================
# INSTANCE PROFILES — one block per model family; switch via
# models.instance.profile above. coco_classes are 1-INDEXED (wrapper
# subtracts 1 before matching the model's 0-indexed outputs).
# ===========================================================================
instance_profiles:

  # ── 2class ── for checkpoints trained on the 2-class scheme
  #    (Detection_Dataset, merged_2class, kaggle_2class, auto-labeled)
  #    model classes: 0='Military Vehicle', 1='person'
  2class:
    - name: "mil vehicle"
      text_prompt: "military vehicle"
      coco_classes: [1]
      display_mode: "both"
      color: "#ffc800"
      is_semantic: false
      confidence_threshold: 0.50
    - name: "person"
      text_prompt: "person"
      coco_classes: [2]
      display_mode: "both"
      color: "#00ff80"
      is_semantic: false
      confidence_threshold: 0.20      # best-F1 for yolo11m/exp/freeze10_aug_clean

  # ── rfdetr_2class ── same 2-class scheme as `2class` above, but for a
  #    FINE-TUNED RF-DETR checkpoint specifically. Verified empirically
  #    (2026-07-14): a fine-tuned RFDETRInstanceModel's raw output class
  #    ids are 0-INDEXED, matching the training dataset's own class order
  #    directly (0='Military Vehicle', 1='person') — unlike the YOLO
  #    wrappers, RFDETRInstanceModel does NOT subtract 1 from coco_classes.
  #    This is only true for a fine-tuned checkpoint; RF-DETR's stock
  #    COCO-pretrained weights genuinely are 1-indexed COCO ids (no offset
  #    either way, but the underlying ids differ) — don't reuse this
  #    profile for a non-fine-tuned checkpoint.
  rfdetr_2class:
    - name: "mil vehicle"
      text_prompt: "military vehicle"
      coco_classes: [0]
      display_mode: "both"
      color: "#ffc800"
      is_semantic: false
      confidence_threshold: 0.60   # FP-minimizing pick (2026-08-16) for the actual deployed
      # checkpoint (rfdetr-m/detection_dataset_hardneg/conservative_aug — the previous 0.50
      # comment cited rfdetr-2xl/detection_dataset/coco, a DIFFERENT model/dataset, not this
      # one). Derived from leaderboard.py --thresholds' full conf-sweep curve on BOTH
      # Detection_Dataset/valid (34 img) and /test (55 img) independently, not a single split:
      # valid P/R/F1/FP-img 0.50→0.60 = 0.966/0.814/0.884/0.059 → 1.000/0.786/0.880/0.000;
      # test  P/R/F1/FP-img 0.50→0.60 = 0.900/0.955/0.926/0.127 → 0.938/0.924/0.931/0.073.
      # F1 is flat-to-better on both splits while FP/img drops substantially — a real,
      # low-cost improvement, not a recall-for-FP tradeoff. See
      # reports/detection/threshold_recommendations_{valid,test}.md for the full curves and
      # CLAUDE.md's threshold-selection section for the qualitative fp_full_image_review
      # cross-check (loading-ramp/rig hallucinations, matching the already-documented
      # background-error pattern).
    - name: "person"
      text_prompt: "person"
      coco_classes: [1]
      display_mode: "both"
      color: "#00ff80"
      is_semantic: false
      confidence_threshold: 0.55   # FP-minimizing pick (2026-08-16), same methodology as
      # mil vehicle above. valid P/R/F1/FP-img 0.50→0.55 = 0.897/0.778/0.833/0.118 →
      # 0.946/0.778/0.854/0.059 (FP halves, F1 improves, recall unchanged); test
      # 0.50→0.55 = 0.929/0.696/0.796/0.055 → 0.971/0.607/0.747/0.018 (FP drops further but
      # recall costs more here — disclosed, not hidden: the two splits disagree more for
      # this class than for mil vehicle, best-F1 alone was 0.55 on valid vs 0.30 on test).
      # 0.55 was chosen over staying at 0.50 because the qualitative fp_full_image_review
      # check at 0.55 showed the remaining FPs were genuine near-duplicate boxes on an
      # already-correctly-detected person, not new/different failures.

  # ── 6class ── for merged_6class checkpoints; every object type has its own
  #    threshold + color. model classes: 0=tank 1=truck 2=armored_vehicle
  #    3=civilian_vehicle 4=soldier 5=civilian
  #    (to group into vehicle/person instead: two classes with
  #     coco_classes [1,2,3] and [5,6])
  6class:
    - name: "tank"
      text_prompt: "tank"
      coco_classes: [1]
      display_mode: "both"
      color: "#ffc800"
      is_semantic: false
      confidence_threshold: 0.50
    - name: "truck"
      text_prompt: "military truck"
      coco_classes: [2]
      display_mode: "none"
      color: "#ff7800"
      is_semantic: false
      confidence_threshold: 0.50
    - name: "armored_vehicle"
      text_prompt: "armored vehicle"
      coco_classes: [3]
      display_mode: "both"
      color: "#ffe000"
      is_semantic: false
      confidence_threshold: 0.45
    - name: "civilian_vehicle"       # FP sink: detected, never displayed
      text_prompt: "civilian car"
      coco_classes: [4]
      display_mode: "none"
      color: "#888888"
      is_semantic: false
      confidence_threshold: 0.30
    - name: "soldier"
      text_prompt: "soldier"
      coco_classes: [5]
      display_mode: "both"
      color: "#00ff80"
      is_semantic: false
      confidence_threshold: 0.30
    - name: "civilian"
      text_prompt: "civilian person"
      coco_classes: [6]
      display_mode: "both"
      color: "#00c8ff"
      is_semantic: false
      confidence_threshold: 0.30

  # ── rfdetr_6class ── same scheme as `6class` above, but for a FINE-TUNED
  #    RF-DETR checkpoint (merged_6class dataset) — 0-indexed coco_classes,
  #    same reasoning as rfdetr_2class above. Verified empirically against
  #    weights/detection/rfdetr-m/merged_6class/coco/best.pt (2026-07-15):
  #    raw predicted class ids are 0=tank 1=truck 2=armored_vehicle
  #    3=civilian_vehicle 4=soldier 5=civilian, matching merged_6class's
  #    own data.yaml names: order directly.
  rfdetr_6class:
    - name: "tank"
      text_prompt: "tank"
      coco_classes: [0]
      display_mode: "both"
      color: "#ffc800"
      is_semantic: false
      confidence_threshold: 0.50
    - name: "truck"
      text_prompt: "military truck"
      coco_classes: [1]
      display_mode: "none"
      color: "#ff7800"
      is_semantic: false
      confidence_threshold: 0.50
    - name: "armored_vehicle"
      text_prompt: "armored vehicle"
      coco_classes: [2]
      display_mode: "both"
      color: "#ffe000"
      is_semantic: false
      confidence_threshold: 0.45
    - name: "civilian_vehicle"       # FP sink: detected, never displayed
      text_prompt: "civilian car"
      coco_classes: [3]
      display_mode: "none"
      color: "#888888"
      is_semantic: false
      confidence_threshold: 0.30
    - name: "soldier"
      text_prompt: "soldier"
      coco_classes: [4]
      display_mode: "both"
      color: "#00ff80"
      is_semantic: false
      confidence_threshold: 0.30
    - name: "civilian"
      text_prompt: "civilian person"
      coco_classes: [5]
      display_mode: "both"
      color: "#00c8ff"
      is_semantic: false
      confidence_threshold: 0.30

# ---------------------------------------------------------------------------
# Semantic classes only (instance classes live in instance_profiles above).
# Order must match model output: 0=non_traversable, 1=road_ground, 2=sky
classes:

  - name: "non_traversable"
    text_prompt: "obstacle or non-drivable area"
    display_mode: "none"
    color: "#404040"
    is_semantic: true

  - name: "road_ground"
    text_prompt: "road or drivable ground surface"
    display_mode: "mask_only"
    color: "#6464ff"
    is_semantic: true

  - name: "sky"
    text_prompt: "sky"
    display_mode: "none"
    color: "#c8c8c8"
    is_semantic: true

# ---------------------------------------------------------------------------
temporal:
  semantic_ema:
    alpha: 0.35
    reset_on_scene_cut: true
    scene_cut_threshold: 0.45

  instance_tracker:
    enabled: true                 # false = bypass tracking entirely (raw per-frame detections, no smoothing)
    # "iou" (this project's custom greedy/Hungarian tracker, default) or
    # "bytetrack" (roboflow/trackers' ByteTrackTracker — real Kalman motion
    # model in place of "iou"'s freeze-and-decay hold). use_hungarian_matching/
    # bbox_alpha/score_alpha below are "iou"-only and ignored by "bytetrack".
    backend: iou
    frame_rate: 30.0               # source FPS; "bytetrack" only, scales lost_track_buffer
    iou_threshold: 0.30
    max_hold_frames: 3
    hold_score_decay: 0.85
    bbox_alpha: 0.95
    score_alpha: 0.40
    # Optimal one-to-one assignment (scipy Hungarian) instead of greedy
    # best-IoU-first matching. Only changes behavior in genuine multi-overlap
    # ambiguity (rare with few objects/frame) — safe to enable.
    use_hungarian_matching: false
    # A new track must match for this many STRICTLY CONSECUTIVE frames before
    # it is ever displayed. 1 = no gating (today's behavior). 2-3 suppresses
    # one-off false-positive flicker at the cost of ~1-2 frames of latency
    # (~33-66ms @30fps) before a real object's box first appears.
    min_hits: 3

# ---------------------------------------------------------------------------
# Drop same-class duplicate detections (a box nested inside, or heavily
# overlapping, another box of the same class). Runs before the tracker.
postprocess:
  duplicate_filter:
    enabled: true
    iou_threshold: 0.55          # same-class overlap ratio -> duplicate
    containment_threshold: 0.85  # intersection/min-area -> nested duplicate
    score_margin: 0.05           # prefer the tighter box within this score gap
  # Post-hoc temperature scaling of detection confidence scores. Free at
  # inference (one sigmoid per box). Fit temperatures_path offline via
  # scripts/detection/evaluation/fit_calibration.py against a held-out
  # labeled benchmark before enabling.
  calibration:
    enabled: false
    temperatures_path: null      # e.g. weights/detection/calibration/temperatures.json
    default_temperature: 1.0     # applied to any class missing from the file

# ---------------------------------------------------------------------------
hardware:
  device: "cuda"
  fp16: true
  use_tensorrt: false
  trt_workspace_gb: 4

player:
  mask_alpha: 0.45
  show_fps: true
  show_class_legend: true
  default_speed: 1.0
  draw_road_ground_semantic_last: true

# ---------------------------------------------------------------------------
source:
  type: "video"                   # video | camera | image_dir
  path: "samples/desert_video.mp4"
  camera_index: 0
  image_dir_glob: "*.png"
  fps_hint: 30.0

# ---------------------------------------------------------------------------
# Used only by scripts/segmentation/evaluation/compare_semantic_models.py
orfd_semantic_comparison:
  orfd_trav_gray: 255
  freespace_merged_prob_floor: 0.25
